# Yerel demo ortamı: docker compose up --build  ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres_dev_pw
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hakkopru"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://hk_app:app_dev_pw@db:5432/hakkopru
      DATABASE_ADMIN_URL: postgresql+psycopg://hk_owner:owner_dev_pw@db:5432/hakkopru
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
